services:
  phone-agent:
    build: .
    container_name: phone-ai-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./calls.db:/app/calls.db
    # To run both the web dashboard and the LiveKit agent worker in the container:
    command: >
      sh -c "python agent.py start & uvicorn server:app --host 0.0.0.0 --port 8000"

