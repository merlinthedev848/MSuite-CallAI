services:
  phone-agent:
    build: .
    container_name: phone-ai-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./calls.db:/app/calls.db
      - ./company_knowledge.json:/app/company_knowledge.json

